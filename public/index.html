<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Скинулись 💸</title>
<link rel="stylesheet" href="/app/style.css">
<!-- официальный telegram-web-app.js больше не грузим: на части сетей telegram.org
     недоступен, и блокирующий <script> вешал аппу белым экраном. Мост собирается
     своим шимом из tgWebAppData в URL (см. public/app.js → buildTelegramShim). -->
<script>
/* до всего: любые падения — сразу на экране, а не «белый экран» */
window.addEventListener('error', function (e) {
  var b = document.getElementById('banner');
  if (!b) return;
  b.hidden = false;
  b.textContent = '💥 ' + (e.message ? e.message : 'ошибка загрузки');
});
</script>
</head>
<body>
<div id="banner" class="banner" hidden>🧪 Демо-режим — так это выглядит в Telegram</div>
<main id="view"></main>
<div id="toast" class="toast" hidden></div>
<script src="/app/app.js?v=5"></script>
</body>
</html>
