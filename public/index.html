<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Скинулись 💸</title>
<link rel="stylesheet" href="/app/style.css">
<!-- официальный мост Telegram отдаём СВОИМ сервером: CDN telegram.org на части сетей
     недоступен, и блокирующий <script> с CDN вешал аппу белым экраном (App Store / Web).
     Если скрипт всё равно не загрузится — app.js соберёт шим из tgWebAppData в URL. -->
<script src="/app/telegram-web-app.js?v=1"></script>
<script>
/* до всего: любые падения — сразу на экране, а не «белый экран» */
window.addEventListener('error', function (e) {
  var b = document.getElementById('banner');
  if (!b) return;
  b.hidden = false;
  b.textContent = '💥 ' + (e.message ? e.message : 'ошибка загрузки');
});
</script>
<script>
/* визитка: один пинг на загрузку страницы — по нему с сервера видно, что
   страница дошла до клиента, в каком окружении открылась и на каком этапе
   умерла, если что-то пошло не так (stage=load → appjs → init / js-error). */
(function () {
  var sent = {};
  function ping(stage, msg) {
    if (sent[stage]) return; // не более одного пинга на стадию
    sent[stage] = true;
    try {
      fetch('/api/visit', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        keepalive: true,
        body: JSON.stringify({
          stage: stage || 'load',
          msg: (msg || '').slice(0, 200),
          ua: navigator.userAgent,
          href: location.href.split('#')[0],
          hash: (location.hash || '').slice(1, 120),
          hasTG: !!(window.Telegram && window.Telegram.WebApp),
          vw: innerWidth, vh: innerHeight
        })
      }).catch(function () {});
    } catch (e) {}
  }
  window.__skidVisit = ping;
  ping('load');
  addEventListener('error', function (e) { ping('js-error', (e && e.message) || 'unknown'); });
})();
</script>
</head>
<body>
<div id="banner" class="banner" hidden>🧪 Демо-режим — так это выглядит в Telegram</div>
<main id="view"></main>
<div id="toast" class="toast" hidden></div>
<script src="/app/app.js?v=5"></script>
</body>
</html>
